name: "Fase 1 - Baseline y Firebase Emulator"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fase-01-baseline.yml"
      - "src/**"
      - "scripts/firestore/**"
      - "backups/encrypted/**"
      - "tests/backup/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "firestore.rules"
      - "firebase.phase1.json"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: "Tests, build y emulador (sin despliegue)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: "Instalar dependencias"
        run: npm ci --no-audit --no-fund
      - name: "Validar sintaxis de recuperación privada en GitHub Actions"
        run: node --check scripts/firestore/check-real-backup-recovery.mjs
      - name: "Pruebas unitarias actuales"
        run: npm run test:baseline
      - name: "Pruebas de serialización para backups (sin Firebase real)"
        run: npm run test:backup:codec
      - name: "Validar cifrado y recuperación local"
        run: npm run test:backup:encrypted
      - name: "Verificar formato del respaldo cifrado real sin descifrar"
        run: node scripts/firestore/inspect-github-backup.mjs backups/encrypted/appsem-firestore-2026-10-13T21-27-24-109Z-b3f473bd.appsem.enc
      - name: "Cifrado navegador recuperable con CLI Node"
        run: node --test tests/backup/browser-interoperability.test.mjs
      - name: "Inventario estático (sin acceso a Firebase real)"
        run: npm run baseline:scan
      - name: "Compilación React/Vite"
        run: npm run build
      - name: "Permisos y compatibilidad de reglas (solo emulador)"
        run: npm run test:firestore
      - name: "Obtener tienda pública para integración real"
        uses: actions/checkout@v4
        with:
          repository: eler30mr-star/appsem-store
          ref: be9f6d8f723a92a360a04fb6c341c076daa40489
          path: _store_phase2
          persist-credentials: false
      - name: "Integración backend tienda + Admin SDK + reglas (solo Emulator)"
        run: npm run test:phase2:integration

# No tiene permisos de escritura, credenciales ni acciones de deploy.
